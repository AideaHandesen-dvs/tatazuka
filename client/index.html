<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>佇か（プロトタイプ）</title>
<!-- 「ホーム画面に追加」で URL バー無しの全画面＝箱からブラウザの額縁が消える（既定で ?hud=off） -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171b24">
<link rel="stylesheet" href="style.css">
<!-- プロト用：実機にdevtoolsを繋がず JS エラーを画面に出す（古い Safari の切り分け用） -->
<script>
window.addEventListener('error', function (e) {
  var d = document.getElementById('err') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'err' }));
  d.textContent = 'ERR: ' + (e.message || e.error) + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno;
});
window.addEventListener('unhandledrejection', function (e) {
  var d = document.getElementById('err') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'err' }));
  d.textContent = 'REJECT: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
});
</script>
<style>
#err { position: fixed; z-index: 99; left: 0; right: 0; bottom: 0;
  background: #b00; color: #fff; font: 12px/1.5 monospace; padding: 8px; }
</style>
</head>
<body>
<!-- カメラ背景。許可されると「端末そのものが透明」になる（README §3-1） -->
<video id="camera" autoplay playsinline muted hidden></video>

<!-- 透明な箱。傾きで覗き込む -->
<div id="scene">
  <div id="stage">
    <div id="tatazuka" data-mood="通常">
      <div class="shadow"></div>
      <div class="puppet">
        <div class="body"></div>
        <div class="face">
          <div class="eye left"></div><div class="eye right"></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div id="balloon" hidden></div>
    </div>
  </div>
</div>

<!-- ask 状態の cap だけここにボタンが並ぶ。佇かにねだられる対象 -->
<div id="perm"></div>
<!-- プロト用デバッグ表示 -->
<div id="hud"></div>

<!-- 受動の口（protocol §5-4 talk）：ユーザー→佇かのテキスト入力。
     #scene の兄弟に置く＝タップが #scene のジェスチャ（sense）にならない（#perm と同じ構造） -->
<button id="talk-toggle" type="button">💬</button>
<form id="talk-bar" hidden>
  <input id="talk-text" type="text" autocomplete="off" placeholder="佇かに話しかける">
  <button type="submit">送る</button>
</form>

<!-- VRM 顔レイヤ用：vendor した three.js を "three" として解決（バンドラ不要・外部CDN非依存）。
     importmap 非対応の古いブラウザは単に VRM を読まず CSS の卵にフォールバックする。 -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
